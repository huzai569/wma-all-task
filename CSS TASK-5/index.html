<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yessy Art Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= HEADER / HERO ================= -->
  <header class="hero">

    <nav class="navbar">
      <div class="nav-left">
        <a href="#" class="logo">
          <span class="logo-script">Yessy</span>
          <span class="logo-text">Art Gallery</span>
        </a>

        <ul class="nav-links">
          <li><a href="#">Buy Art <span class="caret"></span></a></li>
          <li><a href="#">Sell Art <span class="caret"></span></a></li>
          <li><a href="#">About Us</a></li>
        </ul>
      </div>

      <div class="nav-right">
        <a href="#">Your Account <span class="caret"></span></a>
        <a href="#" class="hel">Help</a>

        <a href="#" class="cart">
          <!-- cart icon -->
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
  <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
</svg>

          <span class="cart-badge"></span>
          <span class="cart-total">Total: $30.00</span>
        </a>
      </div>
    </nav>

    <div class="hero-content">
      <h1>Simply Art. Simply Beautiful.</h1>
      <p>
        For seventeen years, artists and buyers have trusted<br>
        Yessy to buy and sell art. Now find your perfect art.
      </p>

      <form class="search-box">
        <input type="text" placeholder="Enter Keywords">
        <select>
          <option>All Art</option>
          <option>Paintings</option>
          <option>Photography</option>
          <option>Sculptures</option>
          <option>Digital Art</option>
        </select>
        <button type="submit" aria-label="Search">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2b1a05" stroke-width="2.5" stroke-linecap="round">
            <circle cx="10" cy="10" r="6"></circle>
            <line x1="15" y1="15" x2="21" y2="21"></line>
          </svg>
        </button>
      </form>
    </div>
  </header>

  <!-- ================= CATEGORIES ================= -->
  <section class="categories">
    <div class="categories-heading">
      <h2>Categories</h2>
    </div>

    <div class="categories-grid">
      <a href="#" class="card card-1"></a>
      <a href="#" class="card card-2"></a>
      <a href="#" class="card card-3"></a>
      <a href="#" class="card card-4"></a>
    </div>
  </section>

</body>
</html>
